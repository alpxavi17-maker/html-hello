<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Pago</title>
    <!-- CSS propio -->
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center mt-5">

    <div class="w-75 bg-secondary-subtle payment-form">
        <h2>Pagar Ahora</h2>
        <form>
            <!-- Nombre en la tarjeta -->
            <div class="row mb-3">
                <div class="col-5">
                    <label for="cardName" class="form-label">Card #</label>
                    <input type="text" class="form-control" id="cardName" placeholder="Juan Pérez" required>
                </div>
                <div class="col-3">
                    <label for="cardName" class="form-label">CVC #</label>
                    <input type="text" class="form-control" id="cardName" placeholder="Juan Pérez" required>
                </div>
                <div class="col-4">
                    <label for="cardName" class="form-label">Amount #</label>
                    <input type="text" class="form-control" id="cardName" placeholder="Juan Pérez" required>
                </div>
            </div>

            <!--First and last name-->
            <div class="row mb-3">
                <div class="col-md-6"><label for="firstName" class="form-label">First name</label>
                    <input type="text" class="form-control" id="firstName" placeholder="Name"> </div>
                    <div class="col-md-6"><label for="secondName" class="form-label">Second name</label>
                        <input type="text" class="form-control" id="secondName" placeholder="Second Name">
                    </div>

                </div>

                <!-- Fecha de expiración y CVV -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="expiry" class="form-label">Fecha de expiración</label>
                        <input type="text" class="form-control" id="expiry" placeholder="MM/AA" required>
                    </div>
                    <div class="col-md-6">
                        <label for="cvv" class="form-label">CVV</label>
                        <input type="text" class="form-control" id="cvv" placeholder="123" required>
                    </div>
                </div>

                <!-- Dirección -->
                <div class="mb-3">
                    <label for="address" class="form-label">Dirección</label>
                    <input type="text" class="form-control" id="address" placeholder="Calle, Ciudad, Código Postal"
                        required>
                </div>

                <!-- Botón de pago -->
                <button type="submit" class="btn btn-pay btn-lg">Pagar</button>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
