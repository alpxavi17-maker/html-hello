<body class="d-flex justify-content-center mt-5">

    <div class="border payment-form p-3">
        <div class="col-md-12"><h2 class="w-75 bg-secondary-subtle">Pagar Ahora</h2></div>
        <div id="Dont-miss" class="alert alert-danger" role="alert">Some fields are missing</div>
        <form>
            <!-- Nombre en la tarjeta -->
            <div class="row mb-3">
                <div class="col-5">
                    <label for="cardName" class="form-label">Card #</label>
                    <input type="text" class="form-control" id="cardName" placeholder="Name" required>
                </div>
                <div class="col-3">
                    <label for="cardName" class="form-label">CVC #</label>
                    <input type="text" class="form-control" id="cardName" placeholder="" required>
                </div>
                <div class="col-4">
                    <label for="cardName" class="form-label">Amount #</label>
                    <input type="text" class="form-control" id="cardName" placeholder="" required>
                </div>
            </div>

            <!--First and last name-->
            <div class="row mb-3">
                <div class="col-md-6"><label for="firstName" class="form-label">First name</label>
                    <input type="text" class="form-control" id="firstName" placeholder="Name">
                </div>
                <div class="col-md-6"><label for="secondName" class="form-label">Second name</label>
                    <input type="text" class="form-control" id="secondName" placeholder="Second Name">
                </div>

            </div>

            <!-- Fecha de expiración y CVV -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="expiry" class="form-label">City</label>
                    <input type="text" class="form-control" id="expiry" placeholder="MM/AA" required>
                </div>
                <div class="col-md-3">
                    <label for="cvv" class="form-label">State</label>
                    <input type="text" class="form-control" id="cvv" placeholder="123" required>
                </div>
                <div class="col-md-3">
                    <label for="cvv" class="form-label">Postal Code</label>
                    <input type="text" class="form-control" id="cvv" placeholder="123" required>
                </div>
            </div>

            <!-- Método de pago -->

                </div>

                <!--relleno-->
